# ============================================
# AI社交媒体矩阵管理运营系统 - 用户画像配置
# ============================================
# 用于内容创作时的最终审核，确保内容符合目标用户需求

# 目标用户画像
target_audience:
  # 核心用户群
  primary_users:
    - 想学习AI工具的新手（零基础）
    - 程序员/开发者（想提效）
    - 想提效的打工人/学生
  
  # 用户特征
  characteristics:
    age_range: "18-35岁"
    tech_level: "初中级，对AI工具有兴趣但缺乏系统学习"
    pain_points:
      - "安装配置复杂，容易踩坑"
      - "教程太官方，看不懂"
      - "不知道哪个工具好用"
      - "怕付费，想先用免费的"
    needs:
      - "保姆级、一步一步的教程"
      - "真实踩坑经验分享"
      - "免费/低成本方案优先"
      - "即学即用，快速上手"

# 账号定位
account_positioning:
  name: "AI工具教程博主"
  slogan: "专注分享AI工具安装使用教程，让小白也能轻松上手"
  content_direction:
    - "AI工具安装使用教程（Codex、MiniMax、Cursor等）"
    - "AI工具对比测评"
    - "AI工具使用技巧和踩坑经验"
  style:
    tone: "亲切像朋友聊天，有温度"
    structure: "保姆级教程，分步骤，每步有细节"
    language: "口语化，避免太官方太技术"
    emoji: "适度使用，增强可读性，不滥用"

# 内容质量标准
content_quality:
  # 去AI味要求
  human_signal:
    enabled: true
    requirements:
      - "必须有个人真实感受和踩坑经历"
      - "观点要有取舍，不要中立无取舍"
      - "结构不要太规整，重要处展开，不重要处压缩"
      - "避免连接词密集、大词堆叠、句式整齐"
      - "不要强行升华、结尾金句、苦难叙事"
      - "小红书特别注意：防广告公司感、作文式对仗、四字名词冒号清单、slogan化"
  
  # 基于高赞帖子二次创作
  viral_based:
    enabled: true
    min_likes: 1000  # 最低点赞数阈值
    min_favorites: 500  # 最低收藏数阈值
    requirements:
      - "必须参考点赞/收藏量高的同领域帖子"
      - "学习高赞帖子的标题公式、开头钩子、正文结构、结尾CTA"
      - "但必须原创，不能直接复制内容"
      - "加入自己的真实经验和独特视角"
  
  # 教程细节要求
  tutorial_detail:
    enabled: true
    requirements:
      - "每一步都要有详细的操作说明"
      - "包含具体的按钮名称、菜单路径、参数设置"
      - "包含常见问题和解决方案"
      - "包含注意事项和避坑提醒"
      - "包含验证步骤（如何确认操作成功）"
      - "适合零基础用户，假设读者什么都不懂"
  
  # 合规要求
  compliance:
    enabled: true
    banned_words:
      - "最"（除非是步骤描述如"第一步"）
      - "第一"（除非是步骤描述如"第一步"）
      - "唯一"
      - "顶级"
      - "绝对"
      - "100%"
      - "完美"
    private_traffic_banned:
      - "微信"
      - "公众号"
      - "加群"
      - "私信"
      - "联系方式"

# 最终审核清单
final_review_checklist:
  - "标题是否吸引人，符合爆款公式？"
  - "开头是否有痛点共鸣或钩子？"
  - "正文结构是否清晰，步骤是否详细？"
  - "是否有个人真实感受和踩坑经历？"
  - "是否避免了AI味（模板腔、官腔、概念堆砌、强行升华）？"
  - "是否基于高赞帖子的结构和风格？"
  - "教程细节是否足够详细（按钮、路径、参数、常见问题）？"
  - "标签是否精准，包含流量标签和精准标签？"
  - "结尾是否有互动引导？"
  - "是否包含AI内容标识？"
  - "是否通过合规检查（无违禁词、无私域引流）？"
  - "是否符合目标用户需求（零基础、保姆级、免费优先）？"
  - "字数是否符合平台要求（小红书500字左右）？"
