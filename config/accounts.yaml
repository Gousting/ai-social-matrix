# ============================================
# AI社交媒体矩阵管理运营系统 - 账号配置
# ============================================
# 每个账号需要配置：平台、账号名、Cookie路径、浏览器Profile路径、Clash代理节点
# Cookie和Profile在首次登录后自动生成
# ============================================

accounts:
  # ---------- 小红书 (3个) ----------
  - platform: xiaohongshu
    name: ai_xiaobai
    display_name: "AI小白日记"
    enabled: true
    cookie_path: ./cookies/xiaohongshu/ai_xiaobai.json
    user_data_dir: ./profiles/xhs/ai_xiaobai
    clash_node: "代理节点名称1"
    position: "零基础入门教程，保姆级、截图多、语气亲切"
    daily_post_limit: 1

  - platform: xiaohongshu
    name: ai_gongjukong
    display_name: "AI工具控"
    enabled: true
    cookie_path: ./cookies/xiaohongshu/ai_gongjukong.json
    user_data_dir: ./profiles/xhs/ai_gongjukong
    clash_node: "代理节点名称2"
    position: "工具盘点+效率技巧，清单体、对比图、干货密集"
    daily_post_limit: 1

  - platform: xiaohongshu
    name: coder_toolbox
    display_name: "程序员的AI工具箱"
    enabled: true
    cookie_path: ./cookies/xiaohongshu/coder_toolbox.json
